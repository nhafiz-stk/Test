name: Build MSM8937 Kernel with KernelSU-Next

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev zip ccache git

      - name: Setup Clang & Toolchains
        run: |
          mkdir -p toolchain
          cd toolchain
          # Download Clang 13.0 (r428724) sesuai bawaan kernel kamu
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-13.0.0_r0.1/clang-r428724.tar.gz
          mkdir clang && tar -xf clang-r428724.tar.gz -C clang
          # Download GCC Cross Compilers
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git --depth=1 gcc64
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git --depth=1 gcc32

      - name: Inject KernelSU-Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/rifsneu/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Build Kernel Image
        run: |
          export PATH=$(pwd)/toolchain/clang/bin:$(pwd)/toolchain/gcc64/bin:$(pwd)/toolchain/gcc32/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          make O=out msm8937_defconfig
          make -j$(nproc --all) O=out

      - name: Pack AnyKernel3 Zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 AK3
          cp out/arch/arm64/boot/Image.gz-dtb AK3/
          cd AK3
          zip -r9 ../MSM8937-KernelSU-Next-Android16.zip * -x .git README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v3
        with:
          name: MSM8937-KernelSU-Next-Android16
          path: MSM8937-KernelSU-Next-Android16.zip
