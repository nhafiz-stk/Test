name: Build Kernel Rova Clean + KSU-Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison \
          build-essential zip curl zlib1g-dev libssl-dev bc \
          python3 libfl-dev mkbootimg \
          gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi g++-arm-linux-gnueabi

      - name: Download Toolchain (Proton-Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain

      - name: Clone Clean Kernel Source
        run: |
          git clone --depth=1 -b 16.0 https://github.com/crdroidandroid/android_kernel_xiaomi_rova kernel-workspace

      - name: Inject KSU-Next
        run: |
          cd kernel-workspace
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Compile Kernel
        run: |
          cd kernel-workspace
          export PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH
          
          # 1. Panggil defconfig vendor
          make O=out ARCH=arm64 vendor/msm8937_defconfig
          
          # 2. Paksa terima semua settingan default biar nggak minta input interaktif (Error in reading)
          make O=out ARCH=arm64 olddefconfig
          
          # 3. Eksekusi compile murni pakai Clang & LLD bawaannya (tanpa ld.bfd yang error)
          make -j$(nproc --all) O=out ARCH=arm64 \
          CC=clang \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          KCFLAGS="-w -Wno-error" \
          KCPPFLAGS="-w -Wno-error"

      - name: Upload Hasil Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Rova-Clean-KSUNext
          path: kernel-workspace/out/arch/arm64/boot/Image.gz-dtb
