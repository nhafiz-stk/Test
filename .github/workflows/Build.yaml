name: Build MSM8937 Kernel with KernelSU-Next v1.0.8

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev zip ccache git wget curl

      - name: Clone Open Source Kernel MSM8937
        run: |
          git clone https://github.com/mi-msm8937/android_kernel_xiaomi_msm8937.git --depth=1 kernel

      - name: Setup Clang & Toolchains
        run: |
          mkdir -p toolchain
          cd toolchain
          git clone https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git --depth=1 clang
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git --depth=1 gcc64
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git --depth=1 gcc32

      - name: Inject KernelSU-Next v1.0.8
        run: |
          cd kernel
          # Clone KernelSU-Next spesifik tag versi 1.0.8
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git -b v1.0.8 --depth=1 drivers/kernelsu
          
          # Patch Kconfig & Makefile bawaan kernel
          grep -q "CONFIG_KSU" drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          
          # Aktifkan KSU & OverlayFS di defconfig
          DEFCONFIG=$(find arch/arm64/configs/ -name "*defconfig" | head -n 1)
          echo "CONFIG_OVERLAY_FS=y" >> "$DEFCONFIG"
          echo "CONFIG_KSU=y" >> "$DEFCONFIG"

      - name: Build Kernel Image
        run: |
          cd kernel
          export PATH=$(pwd)/../toolchain/clang/bin:$(pwd)/../toolchain/gcc64/bin:$(pwd)/../toolchain/gcc32/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          DEFNAME=$(basename $(find arch/arm64/configs/ -name "*msm8937*" -o -name "*santoni*" | head -n 1))
          make O=out $DEFNAME
          make -j$(nproc --all) O=out

      - name: Pack AnyKernel3 Zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 AK3
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AK3/ || cp kernel/out/arch/arm64/boot/Image.gz AK3/
          cd AK3
          zip -r9 ../MSM8937-KernelSU-Next-v1.0.8-Android16.zip * -x .git README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSM8937-KernelSU-Next-v1.0.8-Android16
          path: MSM8937-KernelSU-Next-v1.0.8-Android16.zip
