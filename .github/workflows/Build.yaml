name: Build MSM8937 Kernel with KernelSU-Next v1.0.8

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev zip ccache git wget curl libssl-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone Open Source Kernel MSM8937
        run: |
          git clone https://github.com/mi-msm8937/android_kernel_xiaomi_msm8937.git --depth=1 kernel

      - name: Setup Proton Clang
        run: |
          mkdir -p toolchain
          cd toolchain
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 clang

      - name: Inject KernelSU-Next v1.0.8
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/v1.0.8/kernel/setup.sh" | bash -s v1.0.8
          
          DEFCONFIG=$(find arch/arm64/configs/ -name "*defconfig" | head -n 1)
          echo "CONFIG_OVERLAY_FS=y" >> "$DEFCONFIG"
          echo "CONFIG_KSU=y" >> "$DEFCONFIG"

      - name: Build Kernel Image
        run: |
          cd kernel
          export PATH=$(pwd)/../toolchain/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # Fix Host GCC 13+ & warning flags
          export HOSTCFLAGS="-O2 -g -fcommon"
          export HOSTCXXFLAGS="-O2 -g -fcommon"
          export KCFLAGS="-w"
          export KCPPFLAGS="-w"

          DEFNAME=$(basename $(find arch/arm64/configs/ -name "*msm8937*" -o -name "*santoni*" | head -n 1))
          make O=out $DEFNAME
          make -j$(nproc --all) O=out HOSTCFLAGS="-O2 -g -fcommon" HOSTCXXFLAGS="-O2 -g -fcommon" KCFLAGS="-w" KCPPFLAGS="-w"

      - name: Pack AnyKernel3 Zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 AK3
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AK3/ || cp kernel/out/arch/arm64/boot/Image.gz AK3/
          cd AK3
          zip -r9 ../MSM8937-KernelSU-Next-v1.0.8-Android16.zip * -x .git README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSM8937-KernelSU-Next-v1.0.8-Android16
          path: MSM8937-KernelSU-Next-v1.0.8-Android16.zip
