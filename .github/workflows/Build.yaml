name: Build MSM8937 Kernel with KernelSU-Next

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev zip ccache git wget curl

      - name: Setup Clang & Toolchains
        run: |
          mkdir -p toolchain
          cd toolchain
          # Public Open Source Clang dari LineageOS
          git clone https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git --depth=1 clang
          # Cross Compilers GCC Open Source
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git --depth=1 gcc64
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git --depth=1 gcc32

      - name: Inject KernelSU-Next (Manual Search & Hook)
        run: |
          # Cari lokasi folder drivers/ secara presisi di dalam repository
          KDIR=$(find . -maxdepth 3 -type d -name "drivers" | head -n 1 | xargs dirname)
          if [ -z "$KDIR" ]; then
            echo "ERROR: Kernel root directory not found!"
            exit 1
          fi
          echo "Kernel Directory Found at: $KDIR"
          cd "$KDIR"
          
          # Inject source KernelSU-Next manual ke drivers/kernelsu
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git --depth=1 drivers/kernelsu
          
          # Patch drivers/Kconfig & drivers/Makefile secara otomatis
          grep -q "CONFIG_KSU" drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile

      - name: Build Kernel Image
        run: |
          export PATH=$(pwd)/toolchain/clang/bin:$(pwd)/toolchain/gcc64/bin:$(pwd)/toolchain/gcc32/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          # Cari lokasi defconfig dan jalankan make
          KDIR=$(find . -maxdepth 3 -type d -name "drivers" | head -n 1 | xargs dirname)
          cd "$KDIR"
          make O=out msm8937_defconfig
          make -j$(nproc --all) O=out

      - name: Pack AnyKernel3 Zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 AK3
          IMG_PATH=$(find . -name "Image.gz-dtb" | head -n 1)
          cp "$IMG_PATH" AK3/
          cd AK3
          zip -r9 ../MSM8937-KernelSU-Next-Android16.zip * -x .git README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSM8937-KernelSU-Next-Android16
          path: MSM8937-KernelSU-Next-Android16.zip
