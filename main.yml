name: Build Kernel + KSU-Next

on:
  workflow_dispatch: # Mengizinkan tombol "Run workflow" manual di GitHub

jobs:
  build:
    name: Compile Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Workspace
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison \
          build-essential zip curl zlib1g-dev libssl-dev bc \
          python3 libfl-dev mkbootimg

      - name: Download Proton-Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain

      - name: Clone Kernel Source
        run: |
          # GANTI URL dan BRANCH di bawah dengan repository kernel kamu!
          git clone --depth=1 -b nama_branch_kamu https://github.com/username/repo_kernel_kamu.git kernel-workspace

      - name: Inject KSU-Next
        run: |
          cd kernel-workspace
          # Script otomatis untuk integrasi KSU-Next (cek dokumentasi KSU-Next untuk branch yang tepat)
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Inject KSU-Next
        run: |
          cd kernel-workspace
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Patch Techpack Audio (Obat Error)
        run: |
          cd kernel-workspace
          # Nyuntik KBUILD_MODNAME ke semua file C di folder audio biar Clang nggak ngamuk
          find techpack/audio -type f -name "*.c" -exec sed -i '1s/^/#ifndef KBUILD_MODNAME\n#define KBUILD_MODNAME "audio"\n#endif\n/' {} +

      - name: Compile Kernel
        run: |
          cd kernel-workspace
          export PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH
          
          # Defconfig lu
          make O=out ARCH=arm64 msm8937_defconfig
          
          # Hajar build pake Clang + bendera anti-bawel
          make -j$(nproc --all) O=out ARCH=arm64 \
          CC=clang \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          KCFLAGS="-w -Wno-error" \
          KCPPFLAGS="-w -Wno-error"
      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Boot-Image-or-Kernel
          # Path ini disesuaikan, biasanya di arch/arm64/boot/Image.gz-dtb
          path: kernel-workspace/out/arch/arm64/boot/Image*
